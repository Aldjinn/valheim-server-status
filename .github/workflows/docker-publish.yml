name: build&push latest

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: aldjinn/valheim-server-status:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_SUBJECT=${{ github.event.head_commit.message }}
            GIT_COMMIT_AUTHORED_ON=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT_COMMITTED_ON=${{ github.event.head_commit.timestamp }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
